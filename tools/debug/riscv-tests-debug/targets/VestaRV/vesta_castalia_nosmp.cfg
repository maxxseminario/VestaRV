# VestaRV: OpenOCD configuration for the Castalia MCU, independent targets
# The second of two documented configurations: INDEPENDENT TARGETS, NO `target smp`. Local
# file, not vendored upstream; see ../../VENDORED.md.
# NEITHER FILE IS "THE" CONFIGURATION, because stock OpenOCD cannot give both of these at
# once and the reason is its SMP semantics, not the chip. For gdb to show N THREADS with
# distinct mhartid you need -rtos hwthread on hart 0 plus `target smp` over the group, since
# the thread list IS the SMP group, and that is vesta_castalia.cfg. To HALT ONE HART WHILE
# THE OTHERS KEEP RUNNING you need this file: measured against the SMP configuration,
# selecting one target and halting left all four halted, which is what an SMP group is
# supposed to do, while with no group `halt` acts on the current target alone.
# WHAT YOU GIVE UP HERE: gdb sees ONE thread, the target it is connected to, because there is
# no SMP group to enumerate. The other harts are still fully visible and controllable through
# OpenOCD's own `targets` table and monitor verbs, which is where the evidence is read anyway.
# Everything not annotated below is identical to vesta_castalia.cfg and annotated there.

# ORDER IS LOAD-BEARING: `adapter driver` MUST precede `transport select`; see
# vesta_castalia.cfg for the failure text it cost.
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

transport select jtag

# The JTAG rate is the bridge's own and `adapter speed` is a no-op for this adapter. THE
# 3.60 MHz PROGBUF BOUND AND THE 140 ns FLOOR APPLY HERE IDENTICALLY, because the interop
# hazard is a property of the transport and the DTM rather than of the target topology. Read
# the note in vesta_castalia.cfg before changing any timing here; it is not duplicated,
# because two copies of a measurement drift apart.
set _CHIPNAME vesta
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x1CA57EEF

# THE ONE STRUCTURAL DIFFERENCE FROM vesta_castalia.cfg: no -rtos hwthread on hart 0, since
# that RTOS enumerates an SMP group and there is none here, so asking for it would advertise
# a thread list this configuration cannot honour; and no `target smp`, which is the whole
# point of the file. Every hart is still created, so `targets` lists all N and selects any.
set NHARTS 4
for {set h 0} {$h < $NHARTS} {incr h} {
    target create $_CHIPNAME.cpu$h riscv -chain-position $_CHIPNAME.cpu -coreid $h
}

gdb report_data_abort enable
gdb report_register_access_error enable

# MANDATORY, AND ONLY HALF THE REQUIREMENT: the other half is `timeout_sec = 120` in the
# target .py, which defaults to 2 and so fails on a correct chip, since a 256-byte progbuf
# memory read measures about 3.8 s. Both halves or neither.
riscv set_command_timeout_sec 120

init

# REQUIRED: VestaRV has no system bus access and the access-memory abstract command answers
# NOT_SUPPORTED, so every memory access goes through the program buffer.
foreach t [target names] {
    targets $t
    riscv set_mem_access progbuf
}
targets $_CHIPNAME.cpu0

# HALTING ONE HART WHILE THE OTHERS RUN, the procedure this file exists for:
#     (gdb) monitor targets vesta.cpu2      ;# select the victim
#     (gdb) monitor halt                    ;# halts ONLY vesta.cpu2
#     (gdb) monitor targets                 ;# one halted, the rest running
# READ THE EVIDENCE FROM THE `targets` TABLE, not from gdb's thread list, because with no SMP
# group gdb has only its own connected target to show you.
# EVERY WARNING IN vesta_castalia.cfg APPLIES HERE UNCHANGED and is not repeated: `reset
# halt` reports success and resets nothing; the recovery lever is PWRCR at 0x4B00 bit h and
# exists FOR HARTS 1..N-1 ONLY, since PWRCR bit 0 is read-only zero so hart 0 has no lever
# and its only reset drops your session; a hart halted at reset release can wedge on a
# pending msip and is rescued by `set *(unsigned*)(0x5000 + 4*h) = 0` BEFORE resuming it,
# where MSIP is 0x5000 + 4h at every hart count while MTIME and MTIMECMP MOVE with NHARTS and
# must never be hard-coded; and there are no hardware triggers, so `watch` degrades to a
# software watchpoint that is unusable over this transport.
