# =============================================================================
# vesta_castalia_nosmp.cfg -- the SECOND of VestaRV Castalia's two documented
# OpenOCD configurations.  INDEPENDENT TARGETS, NO `target smp`.
#
# LOCAL FILE (not vendored upstream) -- see ../../VENDORED.md.
#
# WHY TWO FILES EXIST, AND WHY NEITHER IS "THE" CONFIGURATION.
#   d5_spec 5.2 asks for two things that stock OpenOCD cannot give you at the
#   same time, and the reason is OpenOCD's SMP semantics, not the chip:
#
#     (a) gdb showing N THREADS with distinct mhartid.  That needs
#         `-rtos hwthread` on hart 0 plus `target smp` over the group -- the
#         thread list IS the SMP group.  vesta_castalia.cfg does this.
#
#     (b) HALT ONE HART WHILE THE OTHERS KEEP RUNNING.  MEASURED 2026-08-10
#         against vesta_castalia.cfg: `targets vesta.cpu2` followed by `halt`
#         left ALL FOUR targets halted --
#             0  vesta.cpu0  halted        1  vesta.cpu1  halted
#             2* vesta.cpu2  halted        3  vesta.cpu3  halted
#         which is OpenOCD halting the whole SMP group, exactly as an SMP
#         group is supposed to behave.  THIS FILE is how you get (b): with no
#         `target smp`, `halt` acts on the CURRENT target alone and the other
#         harts keep retiring instructions.
#
#   So: use vesta_castalia.cfg for ordinary debugging and for anything that
#   wants the thread view; use THIS file to control one hart while the rest of
#   the chip runs -- per-hart bring-up, watching a tile from a running system,
#   or reproducing d5_spec 5.2's halt-one clause.  Neither file is a fallback
#   for the other and neither is a workaround for a chip defect.
#
#   WHAT YOU GIVE UP HERE: gdb sees ONE thread (the target it is connected to),
#   because there is no SMP group to enumerate.  The other harts are still
#   fully visible and controllable -- through OpenOCD's own `targets` table and
#   `monitor` verbs, which is where the halt-one evidence is read anyway.
#
# Provenance convention as in vesta_castalia.cfg: MEASURED / SOURCE / RTL.
# Everything not annotated below is identical to that file and annotated there.
# =============================================================================

# ORDER IS LOAD-BEARING: `adapter driver` MUST precede `transport select`
# (MEASURED -- see vesta_castalia.cfg for the failure text it cost).
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

transport select jtag

# The JTAG rate is the bridge's (D5_STEP_NS, default 210 ns half-period =
# 420 ns period), and `adapter speed` is a MEASURED no-op for this adapter.
# THE 3.60 MHz PROGBUF BOUND AND THE 140 ns FLOOR APPLY HERE IDENTICALLY --
# the interop hazard is a property of the transport and the DTM, not of the
# target topology.  Read the long note in vesta_castalia.cfg before changing
# any timing here; it is not duplicated, because two copies of a measurement
# drift apart.
set _CHIPNAME vesta
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x1CA57EEF

# THE ONE STRUCTURAL DIFFERENCE FROM vesta_castalia.cfg.
#   * no `-rtos hwthread` on hart 0 -- the hwthread RTOS enumerates an SMP
#     group, and there is none here, so asking for it would advertise a thread
#     list this configuration cannot honour.
#   * no `eval target smp $_TLIST` -- this is the whole point of the file.
# Every hart is still created, so `targets` lists all N and `targets <name>`
# selects any of them.
set NHARTS 4
for {set h 0} {$h < $NHARTS} {incr h} {
    target create $_CHIPNAME.cpu$h riscv -chain-position $_CHIPNAME.cpu -coreid $h
}

gdb report_data_abort enable
gdb report_register_access_error enable

# MANDATORY, and this is only half the requirement -- the other half is
# `timeout_sec = 120` in the target .py (targets.Target.timeout_sec DEFAULTS TO
# 2, which fails on a correct chip: a 256-byte progbuf memory read measures
# ~3.8 s).  Both halves or neither.
riscv set_command_timeout_sec 120

init

# REQUIRED: VestaRV has no system bus access (DD5 / R-DD2) and cmdtype 2
# answers NOT_SUPPORTED (RTL), so every memory access goes through the program
# buffer.
foreach t [target names] {
    targets $t
    riscv set_mem_access progbuf
}
targets $_CHIPNAME.cpu0

# =============================================================================
# HALTING ONE HART WHILE THE OTHERS RUN -- the procedure this file exists for.
#
#     (gdb) monitor targets vesta.cpu2      ;# select the victim
#     (gdb) monitor halt                    ;# halts ONLY vesta.cpu2
#     (gdb) monitor targets                 ;# read the table: one halted, rest running
#
# Read the evidence from the `targets` TABLE, not from gdb's thread list --
# with no SMP group gdb has only its own connected target to show you.
#
# EVERY WARNING IN vesta_castalia.cfg APPLIES HERE UNCHANGED and is not
# repeated: `reset halt` reports success and resets nothing; the recovery lever
# is PWRCR at 0x4B00 bit h and exists FOR HARTS 1..N-1 ONLY (PWRCR bit 0 is
# RO-0 -- hart 0 has no lever, and its only reset drops your session); a hart
# halted at reset release can wedge on a pending msip and is rescued by
# `set *(unsigned*)(0x5000 + 4*h) = 0` BEFORE resuming it (MSIP is 0x5000+4h at
# both N; MTIME/MTIMECMP MOVE with NHARTS and must never be hard-coded); there
# are no hardware triggers, so `watch` degrades to a software watchpoint that
# is unusable over this transport.
# =============================================================================
