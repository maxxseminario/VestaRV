# =============================================================================
# vesta_castalia.cfg -- OpenOCD configuration for the VestaRV "Castalia" MCU
# (4 harts, RV32IMAC_Zicsr + M-mode, IDCODE 0x1CA57EEF), driven over the D5
# remote_bitbang bridge that lives inside the Xcelium simulation.
#
# LOCAL FILE (not vendored upstream) -- see ../../VENDORED.md.
#
# Every non-obvious line below is annotated with HOW IT IS KNOWN: MEASURED
# (observed against this exact OpenOCD, xPack 0.12.0-7 / 0.12.0+dev-02228-
# ge5888bda3), SOURCE (read in riscv-013.c at the commit this binary was built
# from), or RTL (read in hdl/common/{jtag_dtm,debug_module,pwr_ctrl}.vhd).
# A line with no provenance is a line somebody will delete for the wrong
# reason later.
# =============================================================================

# MEASURED: without this, OpenOCD prints
#   "Warn : DEPRECATED: auto-selecting transport jtag".
transport select jtag

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

# MEASURED: `adapter speed` is a NO-OP for this adapter -- OpenOCD answers
#   "the adapter remote_bitbang doesn't support configurable speed"
# and it is DELIBERATELY ABSENT rather than set-and-ignored.  The JTAG rate is
# the bridge's (D5_STEP_NS, default 70 ns half-period = 140 ns period).
#
# THAT 140 ns IS A CONTRACT, NOT A PREFERENCE (RTL, jtag_dtm.vhd's own
# derivation): dtmcs.idle = 7 is derived from a stated assumption of
# T_TCK >= 140 ns against mclk 41.667 ns, and 7 is the MAXIMUM the 3-bit field
# can express -- there is no headroom left to advertise a longer dwell.  A
# faster TCK is not a speed knob, it is a change to a CDC contract.

# RTL (jtag_dtm.vhd:211-224): IR is 5 bits; IDCODE=0x01, DTMCS=0x10, DMI=0x11,
# BYPASS=0x1F -- identical to Spike, so -irlen 5 transfers.  Every unsupported
# IR opcode selects BYPASS.
#
# *** A MISMATCH HERE IS ONLY A WARNING IN THIS OPENOCD (MEASURED). ***
# It does NOT stop the session.  Never infer a correct IDCODE from the absence
# of a failure -- READ THE LOG LINE:
#     Info : JTAG tap: vesta.cpu tap/device found: 0x1ca57eef
set _CHIPNAME vesta
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x1CA57EEF

# MEASURED at N=4 (against stock Spike in VestaRV's shape, and re-measured
# against VestaRV itself): one -rtos hwthread target on hart 0 plus one plain
# -coreid target per remaining hart, joined with `target smp`, gives gdb
# exactly N threads with distinct mhartid.  Written as a loop so the Argus
# file differs in ONE number.
set NHARTS 4
set _TLIST {}
for {set h 0} {$h < $NHARTS} {incr h} {
    set t $_CHIPNAME.cpu$h
    if {$h == 0} {
        target create $t riscv -chain-position $_CHIPNAME.cpu -coreid 0 -rtos hwthread
    } else {
        target create $t riscv -chain-position $_CHIPNAME.cpu -coreid $h
    }
    lappend _TLIST $t
}
eval target smp $_TLIST

# MEASURED: the underscore spellings (gdb_report_data_abort) are DEPRECATED in
# 0.12.0-7 and warn.  These are the current spellings.
gdb report_data_abort enable
gdb report_register_access_error enable

# ---------------------------------------------------------------------------
# TIMEOUTS ARE MANDATORY HERE, AND THIS IS ONLY HALF OF THE REQUIREMENT.
#
# The transport is a simulator: ~127 us of wall clock per TCK on this design.
# MEASURED per-verb costs make the defaults untenable -- a gdb `g` packet (all
# 33 registers) is ~12,100 TCK ~ 1.7 s, and a 256-BYTE MEMORY READ THROUGH THE
# PROGRAM BUFFER IS ~26,900 TCK ~ 3.8 s, which EXCEEDS the 2 s default on
# every architecture measured.
#
# THE OTHER HALF LIVES IN THE TARGET .py: `timeout_sec = 120`.
# targets.Target.timeout_sec DEFAULTS TO 2 and is what the harness passes as
# gdb's remotetimeout, so setting only this line leaves the gdb side at 2 s and
# the first big memory read still fails.  Both halves or neither.
# Interactive gdb users want `set remotetimeout 120` for the same reason.
# ---------------------------------------------------------------------------
riscv set_command_timeout_sec 120

init

# MEASURED accepted, and REQUIRED: VestaRV has NO system bus access (DD5 /
# R-DD2).  cmdtype 2 (access-memory) answers NOT_SUPPORTED (RTL,
# debug_module.vhd), and sbcs reads all-zeros meaning "no system bus", so
# every memory access must go through the program buffer -- progbufsize = 2
# with impebreak = 1 gives the three words OpenOCD's lw/sw idiom needs.
foreach t [target names] {
    targets $t
    riscv set_mem_access progbuf
}
targets $_CHIPNAME.cpu0

# DELIBERATELY ABSENT: `riscv authdata_read` / `authdata_write`.
#   The vendored spike cfgs carry that handshake ONLY because their harness
#   forced spike's --dm-auth (testlib.py, since made conditional -- see
#   ../../VENDORED.md).  VestaRV implements no authdata register at all (0x30
#   is not one of its implemented DMI addresses) and drives
#   dmstatus.authenticated = 1.  SOURCE riscv-013.c:1642: an unauthenticated
#   DM logs an error and leaves the target unusable -- so the correct action
#   here is to say nothing.

# OPTIONAL, MEASURED: OpenOCD polls a halted target at ~1,025 TCK/s (~102 TCK
# per 100 ms).  Over a simulation bridge that is a permanent ~13 % background
# load.  `poll off` removes it EXACTLY (4,238 TCK at both 0 s and 10 s idle --
# an unambiguous control), but gdb then cannot learn about an ASYNCHRONOUS
# halt.  Recommended for TCK-budget measurement; NOT for an interactive
# session.
# poll off

# =============================================================================
# THINGS THIS CHIP DOES THAT WILL SURPRISE A DEBUGGER.  Read before filing a
# bug against OpenOCD.
#
# 1. `reset halt` REPORTS SUCCESS AND RESETS NOTHING.
#    VestaRV's ndmreset and hartreset are read-zero WARL (RTL), so there is no
#    DMI lever for a system reset.  SOURCE: assert_reset() writes HALTREQ then
#    NDMRESET and returns ERROR_OK UNCONDITIONALLY -- it never checks that
#    ndmreset took; deassert_reset() then waits only for !ALLUNAVAIL and sets
#    TARGET_HALTED unconditionally.  Net: the hart really will be halted (by
#    haltreq), nothing will have been reset, and OPENOCD CANNOT TELL YOU IT
#    DEGRADED.
#    THE REAL RESET IS THE PER-TILE PWRCTRL PATH -- see note 2.
#
# 2. THE RECOVERY LEVER EXISTS FOR HARTS 1..N-1 ONLY.  NOT FOR HART 0.
#    A tile is reset by power-cycling it through PWRCR at 0x4B00, bit h, with
#    a FULL-WORD store (the write is byte-lane-0 qualified), issued from a
#    SECOND halted hart's program buffer -- in gdb, plain memory writes.
#    PWRCR BIT 0 IS RO-0: hart 0 is the always-on management hart (SPI boot,
#    console, CLINT owner) and ignores writes.  So hart 0's only reset is the
#    chip `resetn` pad, WHICH ALSO RESETS THE DEBUG MODULE AND DROPS YOUR
#    SESSION.  Hart 0 is the hart a student attaches to first; there is no
#    lever for it, and no wording here pretends otherwise.
#    All tile state is lost on a power-cycle -- it is a COLD gate, no retention.
#
# 3. A HART HALTED AT RESET RELEASE CAN WEDGE ON A PENDING msip.
#    Launch protocol is "loader row first, then msip[h] = 1", and msip is a
#    LEVEL that stays asserted until software clears it.  A hart held halted at
#    reset never ran the bootrom, so IVT slot 83 was never armed; on resume it
#    takes the pending msip into an unarmed slot and sits in terminal
#    TRAP_STATE.
#    THE PROCEDURE, before resuming such a hart:
#        (gdb) set *(unsigned*)(0x5000 + 4*h) = 0
#    CLINT MSIP is 0x5000+4h at BOTH N=4 and N=18.  MTIME and MTIMECMP MOVE
#    with NHARTS (N=4: 0x5010/0x5020; N=18: 0x5050/0x5060) -- never hard-code
#    those.
#
# 4. THE FIRST HALT OF A HART DEPENDS ON THE DM HAVING PLANTED ITS ENTRY PAGE.
#    The Debug Module plants the 40-word trampoline itself, at every dmactive
#    rise and before every halt's token is consumed.  OpenOCD sets dmactive
#    before any haltreq (VERIFIED ON THE WIRE), so the ordering is correct by
#    construction -- but a dmcontrol write that set dmactive AND haltreq in the
#    SAME word would be a race against that plant, not an ordering.
#
# 5. There are NO hardware triggers on this chip yet.  `hbreak` and hardware
#    watchpoints are unavailable; gdb's `watch` silently degrades to a SOFTWARE
#    watchpoint, which single-steps the program at ~17,500 TCK per step and is
#    unusable over this transport.  Use software breakpoints (`break`).
# =============================================================================
