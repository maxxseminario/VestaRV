# VestaRV: OpenOCD configuration for the Castalia MCU, SMP view
# 4 harts, RV32IMAC_Zicsr, M-mode, IDCODE 0x1CA57EEF, driven over the remote_bitbang bridge
# that lives inside the Xcelium simulation. Local file, not vendored upstream; see
# ../../VENDORED.md.
# Every non-obvious line below is annotated with how it is known: MEASURED against this
# OpenOCD, SOURCE from riscv-013.c, or RTL from the chip's own VHDL. A line with no
# provenance is a line somebody will delete for the wrong reason.

# ORDER IS LOAD-BEARING: `adapter driver` MUST precede `transport select`, because the list
# of supported transports is a property of the driver. With the transport first, OpenOCD
# aborts at that line with "doesn't support any transports?" and never reaches `init`.
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

# Stating the transport suppresses a DEPRECATED auto-select warning.
transport select jtag

# `adapter speed` IS DELIBERATELY ABSENT rather than set and ignored: it is a no-op for this
# adapter, and the JTAG rate is the bridge's own (D5_STEP_NS, default a 420 ns period).
#
# 140 ns IS A FLOOR, NOT THE OPERATING RATE. dtmcs.idle = 7 is derived from an assumed
# T_TCK of at least 140 ns, and 7 is the maximum the 3-bit field can express, so there is no
# headroom to advertise a longer dwell; a faster TCK is not a speed knob but a change to a
# CDC contract.
#
# THE SESSION RUNS AT 420 ns AS THE DOCUMENTED OPERATING POINT, and the reason is an interop
# hazard, not a slow chip. VestaRV derives its CDC margin from the debugger dwelling
# dtmcs.idle cycles after a DMI scan, and THIS OPENOCD DOES NOT HONOUR IT: measured at
# 140 ns, 929 of 1036 inter-scan gaps were shorter than 7 idle cycles and 424 had none at
# all, because riscv-013 inserts only its own calibrated busy delay, which starts at zero. A
# too-early scan sets the DTM's sticky busy, which then silently drops every non-NOP
# Update-DR, so a progbuf write is lost while OpenOCD believes it landed, postexec runs a
# half-written buffer, and the hart traps with cmderr 3, surfacing as "Failed to read MISA".
# The chip is not at fault at its own floor: driven by a dwell-honouring master at 140 ns the
# abstract-command suite passes 13 of 13.
#
# THE ARITHMETIC, because it is what you need on silicon rather than in simulation. The
# measured minimum navigation gap between two DMI scans is 3 TCK, so with a master that
# inserts no idle cycles the constraint is 3 * T_TCK >= t_DM, and t_DM is 417 ns for a plain
# DM register access and 833 ns for a PROXIED one that has to cross the shared bus. That
# gives T_TCK >= 139 ns, f_TCK <= 7.19 MHz, for register-class traffic and T_TCK >= 278 ns,
# f_TCK <= 3.60 MHz, for progbuf-class traffic, and the proxied bound SHRINKS FURTHER under
# shared-bus contention, because t_DM is what the arbiter grants rather than what the DM asks
# for. That predicts the observed split exactly.
# ON SILICON, WITH STOCK OpenOCD, SET THE ADAPTER TO ABOUT 3 MHz OR LESS. Lengthening the
# period needs no authorisation; shortening it does.
#
# Spike cannot exhibit any of this, since its DMI is zero-time and its busy never fires, so a
# Spike baseline is not evidence about it. THE HAZARD ITSELF IS UNRESOLVED and is a finding,
# not a setting.

# RTL: IR is 5 bits, with IDCODE 0x01, DTMCS 0x10, DMI 0x11 and BYPASS 0x1F, identical to
# Spike, so -irlen 5 transfers, and every unsupported IR opcode selects BYPASS.
# A MISMATCH HERE IS ONLY A WARNING IN THIS OPENOCD and does not stop the session, so never
# infer a correct IDCODE from the absence of a failure: read the "tap/device found" log line.
set _CHIPNAME vesta
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x1CA57EEF

# MEASURED: one -rtos hwthread target on hart 0 plus one plain -coreid target per remaining
# hart, joined with `target smp`, gives gdb exactly N threads with distinct mhartid. Written
# as a loop so the Argus file differs in ONE number.
set NHARTS 4
set _TLIST {}
for {set h 0} {$h < $NHARTS} {incr h} {
    set t $_CHIPNAME.cpu$h
    if {$h == 0} {
        target create $t riscv -chain-position $_CHIPNAME.cpu -coreid 0 -rtos hwthread
    } else {
        target create $t riscv -chain-position $_CHIPNAME.cpu -coreid $h
    }
    lappend _TLIST $t
}
eval target smp $_TLIST

# SMP MEMORY ROUTING: A SOFTWARE BREAKPOINT ON HART h LANDS IN HART 0's TCM. READ THIS
# BEFORE DEBUGGING A TILE. Under -rtos hwthread with `target smp`, REGISTER access follows
# the gdb thread you selected but MEMORY access goes to the CONNECTION's target, hart 0;
# measured with thread 3 selected, the c.ebreak landed in hart 0's TCM and the victim's word
# did not change. That is not cosmetic here, because a tile's TCM at 0x8000-0xBFFF is
# PRIVATE, so the breakpoint is planted in a tile that never executes the address and the
# hart you meant to stop runs on for ever. The SHARED window is hart-agnostic and is NOT
# affected, which is why shared-word accesses behave as expected and only TCM work
# misbehaves: that asymmetry is the tell.
# WHAT TO DO INSTEAD: use the independent-targets configuration vesta_*_nosmp.cfg and connect
# gdb to the hart's OWN gdb port, which OpenOCD hands out one per target from the base port
# in creation order, so base+h is hart h. It is an interop property of OpenOCD's SMP view,
# not a chip defect, and no .cfg option switches it off.

# MEASURED: the underscore spellings (gdb_report_data_abort) are DEPRECATED in
# 0.12.0-7 and warn.  These are the current spellings.
gdb report_data_abort enable
gdb report_register_access_error enable

# TIMEOUTS ARE MANDATORY HERE AND THIS IS ONLY HALF THE REQUIREMENT. The transport is a
# simulator at about 127 us of wall clock per TCK, so a gdb `g` packet costs about 1.7 s and
# a 256-byte memory read through the program buffer about 3.8 s, which exceeds the 2 s
# default. THE OTHER HALF IS `timeout_sec = 120` IN THE TARGET .py, which the harness passes
# as gdb's remotetimeout and which defaults to 2: set both or neither. Interactive gdb users
# want `set remotetimeout 120` for the same reason.
riscv set_command_timeout_sec 120

init

# REQUIRED: VestaRV has NO system bus access. The access-memory abstract command answers
# NOT_SUPPORTED and sbcs reads all-zeros, so every memory access must go through the program
# buffer, where progbufsize 2 with impebreak gives the three words OpenOCD's lw/sw idiom
# needs.
foreach t [target names] {
    targets $t
    riscv set_mem_access progbuf
}
targets $_CHIPNAME.cpu0

# DELIBERATELY ABSENT: `riscv authdata_read` and `authdata_write`. The vendored spike
# configurations carry that handshake only because their harness forced spike's --dm-auth.
# VestaRV implements no authdata register at all and drives dmstatus.authenticated = 1, and
# an unauthenticated DM leaves the target unusable, so the correct action here is silence.

# OPTIONAL: OpenOCD polls a halted target at about 1025 TCK/s, a permanent 13 percent
# background load over a simulation bridge. `poll off` removes it exactly, but gdb then
# cannot learn about an ASYNCHRONOUS halt, so it suits TCK-budget measurement and not an
# interactive session.
# poll off

# THINGS THIS CHIP DOES THAT WILL SURPRISE A DEBUGGER. Read before filing a bug against
# OpenOCD.
#
# 1. `reset halt` REPORTS SUCCESS AND RESETS NOTHING. ndmreset and hartreset are read-zero
#    WARL, so there is no DMI lever for a system reset, and assert_reset returns success
#    unconditionally without checking that ndmreset took, while deassert_reset then sets the
#    halted state unconditionally. The hart really will be halted, by haltreq, nothing will
#    have been reset, and OPENOCD CANNOT TELL YOU IT DEGRADED. The real reset is note 2.
#
# 2. THE RECOVERY LEVER EXISTS FOR HARTS 1..N-1 ONLY, NOT FOR HART 0. A tile is reset by
#    power-cycling it through PWRCR at 0x4B00, bit h, with a FULL-WORD store, since the write
#    is byte-lane-0 qualified, issued from a SECOND halted hart's program buffer, which in
#    gdb is a plain memory write. PWRCR BIT 0 IS READ-ONLY ZERO: hart 0 is the always-on
#    management hart and ignores writes, so its only reset is the chip reset pad, WHICH ALSO
#    RESETS THE DEBUG MODULE AND DROPS YOUR SESSION. All tile state is lost on a power-cycle,
#    because it is a cold gate with no retention.
#
# 3. A HART HALTED AT RESET RELEASE CAN WEDGE ON A PENDING msip. The launch protocol is
#    loader row first, then msip[h] = 1, and msip is a LEVEL that stays asserted until
#    software clears it. A hart held halted at reset never ran the boot ROM, so its IVT slot
#    was never armed, and on resume it takes the pending msip into an unarmed slot and sits
#    in the terminal trap state. THE PROCEDURE, BEFORE RESUMING SUCH A HART, is to clear the
#    level: (gdb) set *(unsigned*)(0x5000 + 4*h) = 0. CLINT MSIP is 0x5000 + 4h at every hart
#    count, but MTIME and MTIMECMP MOVE WITH NHARTS, so never hard-code those. That write is
#    a MEMORY write, so under `target smp` it goes to the connection's target, but CLINT is
#    in the SHARED window so it reaches the right place from any hart.
#
# 4. THE FIRST HALT OF A HART DEPENDS ON THE DM HAVING PLANTED ITS ENTRY PAGE. The Debug
#    Module plants the 40-word trampoline itself at every dmactive rise and before every
#    halt's token is consumed, and OpenOCD sets dmactive before any haltreq, so the ordering
#    is correct by construction. A dmcontrol write that set dmactive AND haltreq in the SAME
#    word would be a race against that plant rather than an ordering.
#
# 5. There are NO hardware triggers on this chip yet, so `hbreak` and hardware watchpoints
#    are unavailable and gdb's `watch` silently degrades to a SOFTWARE watchpoint, which
#    single-steps at about 17500 TCK per step and is unusable over this transport. Use
#    software breakpoints.
#
# 6. WHILE A HART IS HALTED, dscratch0 AND dscratch1 ARE THE SINGLE HOME OF THE INTERRUPTED
#    PROGRAM'S s0 AND s1. A debugger that reads s0 gets dscratch0's value, a write lands
#    there, a program-buffer change survives to the next abstract read, and a plain halt and
#    resume with no register writes leaves the pair as it found it. The two shared words at
#    0x106F0 and 0x106F4 are the entry stub's own repair copies, are NOT where a debugger
#    reads those registers from, and nothing else should read them at all.
#
# 7. TWO SESSION-TOOLING TRAPS that read exactly like a chip fault. A hardcoded gdb port that
#    no longer matches the runner's --gdb-port attaches to the WRONG TARGET, so OpenOCD
#    examines perfectly and every chip-side observable stays green while every gdb-side check
#    fails; the one tell is gdb's own log line naming the port. And gdb INVENTS CONVENIENCE
#    VARIABLES, so `set $mscratch = ...` and `p/x $anything` succeed with no target attached
#    at all and a gdb transcript is not by itself proof of a session; `info registers <name>`
#    has no such fallback and fails loudly, so prefer it.
#
# 8. A hartsel WRITTEN BY A RAW `monitor riscv dmi_write 0x10 ...` DOES NOT SURVIVE to the
#    next monitor command, because OpenOCD's background polling owns dmcontrol and walks
#    every hart between two commands. Anything needing hartsel stable across commands must
#    `poll off` first and `poll on` after, or do the write and the dependent read inside one
#    command. After raw hartsel manipulation OpenOCD's CACHED notion of the selected hart is
#    stale, so a following memory access can fail with cmderr 4 until the target is
#    re-selected with `targets <t>` or hartsel is written back.
