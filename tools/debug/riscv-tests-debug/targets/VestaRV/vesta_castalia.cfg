# =============================================================================
# vesta_castalia.cfg -- OpenOCD configuration for the VestaRV "Castalia" MCU
# (4 harts, RV32IMAC_Zicsr + M-mode, IDCODE 0x1CA57EEF), driven over the D5
# remote_bitbang bridge that lives inside the Xcelium simulation.
#
# LOCAL FILE (not vendored upstream) -- see ../../VENDORED.md.
#
# Every non-obvious line below is annotated with HOW IT IS KNOWN: MEASURED
# (observed against this exact OpenOCD, xPack 0.12.0-7 / 0.12.0+dev-02228-
# ge5888bda3), SOURCE (read in riscv-013.c at the commit this binary was built
# from), or RTL (read in hdl/common/{jtag_dtm,debug_module,pwr_ctrl}.vhd).
# A line with no provenance is a line somebody will delete for the wrong
# reason later.
# =============================================================================

# ORDER IS LOAD-BEARING AND IT COST A RUN.  `adapter driver` MUST precede
# `transport select`.  MEASURED 2026-08-10, first contact with a real OpenOCD:
# with `transport select jtag` first, 0.12.0-7 aborts at that line with
#   "Error: Debug adapter doesn't support any transports?"
# and never reaches `init` -- because the list of supported transports is a
# property of the adapter driver, and no driver has been chosen yet.  The
# earlier ordering here was written from the measurement of what happens when
# the line is ABSENT (a DEPRECATED auto-select warning), which is a different
# experiment.
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

# MEASURED: without this, OpenOCD prints
#   "Warn : DEPRECATED: auto-selecting transport jtag".
transport select jtag

# MEASURED: `adapter speed` is a NO-OP for this adapter -- OpenOCD answers
#   "the adapter remote_bitbang doesn't support configurable speed"
# and it is DELIBERATELY ABSENT rather than set-and-ignored.  The JTAG rate is
# the bridge's (D5_STEP_NS, default 210 ns half-period = 420 ns period).
#
# 140 ns IS A FLOOR, NOT THE OPERATING RATE (RTL, jtag_dtm.vhd's own
# derivation): dtmcs.idle = 7 is derived from a stated assumption of
# T_TCK >= 140 ns against mclk 41.667 ns, and 7 is the MAXIMUM the 3-bit field
# can express -- there is no headroom left to advertise a longer dwell.  A
# faster TCK is not a speed knob, it is a change to a CDC contract.
#
# THE SESSION RUNS AT 420 ns AS THE DOCUMENTED OPERATING POINT -- DECIDED,
# NOT INTERIM (USER decision DD18, recorded as R-DD7, 2026-08-10).  An earlier
# draft of this comment called it "an interim workaround"; it is not one, and
# there is no pending change that would remove it.  THE MECHANISM IS MEASURED
# AND IT IS AN INTEROP HAZARD, NOT A SLOW CHIP.
#   * VestaRV advertises dtmcs.idle = 7 and derives its CDC margin from the
#     debugger dwelling that long after a DMI scan (RTL, jtag_dtm.vhd).
#   * THIS OPENOCD DOES NOT HONOUR IT.  Measured on the wire at 140 ns: of
#     1036 inter-scan gaps, 929 (90%) were shorter than 7 idle cycles and 424
#     (41%) had NO idle cycle at all.  riscv-013 inserts only its own
#     empirically-calibrated busy delay, which starts at zero.
#   * A too-early scan sets the DTM's sticky busy, and DEVIATION 4 then
#     SILENTLY DROPS every non-NOP Update-DR while sticky -- so a progbuf
#     WRITE is lost while OpenOCD believes it landed, postexec runs a
#     half-written program buffer, and the hart traps: cmderr=3, surfacing as
#     "Failed to read MISA from hart N".
#   * The chip is NOT at fault at its own floor: driven by a dwell-honouring
#     master (the D-series BFM, dwell=8) at 140 ns, dbg_abs passes 13/13
#     including POSTEXEC with cmderr=0.
#
# THE ARITHMETIC, BECAUSE IT IS WHAT YOU NEED ON SILICON RATHER THAN IN SIM.
# The measured minimum navigation gap between two DMI scans is 3 TCK (which
# confirms the RTL's own "idle + 3"), so with a master that inserts NO idle
# cycles the constraint is simply
#
#     3 x T_TCK  >=  t_DM
#
# and t_DM is 417 ns for a plain DM REGISTER access and 833 ns for a PROXIED
# one (a progbuf/abstract access that has to cross the shared bus).  That
# gives
#
#     register-class traffic   T_TCK >= 139 ns   ->  f_TCK <= 7.19 MHz
#     PROXIED (progbuf) class  T_TCK >= 278 ns   ->  f_TCK <= 3.60 MHz
#
# and the proxied bound SHRINKS FURTHER under shared-bus contention, because
# t_DM is what the arbiter grants, not what the DM asks for.  This predicts the
# observed 140-vs-420 ns split exactly: at 140 ns the gap is 420 ns, which
# clears the register bound by 3 ns and misses the proxied bound by 2.0x; at
# 420 ns the gap is 1260 ns, a 1.51x margin on the proxied bound.
#
# *** ON SILICON, WITH STOCK OpenOCD: SET THE ADAPTER TO <= ~3 MHz. ***
# 3.60 MHz is the hard bound for progbuf-class work and 3 MHz is the
# recommendation that leaves margin for bus contention.  The chip's own rated
# 7.14 MHz floor applies ONLY to a master that honours dtmcs.idle, which this
# OpenOCD does not.  Lengthening the period needs no authorisation; shortening
# it does.
#
# Spike CANNOT exhibit any of this -- its DMI is zero-time and its busy never
# fires -- which is why the hazard survived every Spike-based measurement in
# the programme, and why a Spike baseline is not evidence about it.
# THE HAZARD ITSELF IS UNRESOLVED and is a finding, not a setting.  The named
# residue (R-DD7 clause 2) is (a) a scan-level diff to convert the write-loss
# INFERENCE into a measurement and (b) the RTL question of whether the DTM's
# drop-while-sticky should soften for writes, which re-opens d3_cdc_spec and
# is priced there.  See the D5 implementation report.

# RTL (jtag_dtm.vhd:211-224): IR is 5 bits; IDCODE=0x01, DTMCS=0x10, DMI=0x11,
# BYPASS=0x1F -- identical to Spike, so -irlen 5 transfers.  Every unsupported
# IR opcode selects BYPASS.
#
# *** A MISMATCH HERE IS ONLY A WARNING IN THIS OPENOCD (MEASURED). ***
# It does NOT stop the session.  Never infer a correct IDCODE from the absence
# of a failure -- READ THE LOG LINE:
#     Info : JTAG tap: vesta.cpu tap/device found: 0x1ca57eef
set _CHIPNAME vesta
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x1CA57EEF

# MEASURED at N=4 (against stock Spike in VestaRV's shape, and re-measured
# against VestaRV itself): one -rtos hwthread target on hart 0 plus one plain
# -coreid target per remaining hart, joined with `target smp`, gives gdb
# exactly N threads with distinct mhartid.  Written as a loop so the Argus
# file differs in ONE number.
set NHARTS 4
set _TLIST {}
for {set h 0} {$h < $NHARTS} {incr h} {
    set t $_CHIPNAME.cpu$h
    if {$h == 0} {
        target create $t riscv -chain-position $_CHIPNAME.cpu -coreid 0 -rtos hwthread
    } else {
        target create $t riscv -chain-position $_CHIPNAME.cpu -coreid $h
    }
    lappend _TLIST $t
}
eval target smp $_TLIST

# =============================================================================
# *** SMP MEMORY ROUTING: A SOFTWARE BREAKPOINT ON HART h LANDS IN HART 0's
# *** TCM.  MEASURED AT D5, 2026-08-11.  READ THIS BEFORE DEBUGGING A TILE.
#
# Under `-rtos hwthread` + `target smp`, REGISTER access follows the gdb thread
# you selected, but MEMORY access goes to the CONNECTION's target -- hart 0.
# With gdb thread 3 selected AND `targets vesta.cpu2` set, asking for a
# breakpoint at 0x84c8 produced, in OpenOCD's own -d3 log:
#
#     [vesta.cpu0] received packet: Z0,84c8,2
#     riscv_add_breakpoint(): [0] @0x84c8
#     M[0x84c8] writes 0x9002              <- c.ebreak, 2 bytes
#     [vesta.cpu0] added software breakpoint at 0x000084c8
#
# and a chip-side census of all four PRIVATE TCMs confirmed it: hart 0's word
# changed from 0x5D500313 to 0x5D509002 and the victim's did not.
#
# ON THIS CHIP THAT IS NOT COSMETIC.  A tile's TCM (0x8000-0xBFFF) is PRIVATE,
# so the breakpoint is planted in a tile that never executes the address, and
# the hart you meant to stop runs on for ever.  The SHARED window
# (0x0-0x7FFF, 0xC000-0x1FFFF) is hart-agnostic and is NOT affected -- which is
# why memory reads/writes to shared words behave exactly as expected and only
# TCM work misbehaves.  That asymmetry is the tell.
#
# WHAT TO DO INSTEAD: use the independent-targets configuration
# (vesta_*_nosmp.cfg) and connect gdb to the hart's OWN gdb port -- OpenOCD
# hands out one per target from the base port, in creation order, so
# `target extended-remote :<base+h>` is hart h.  Re-measured that way, the
# ebreak lands in hart h's own tile.
#
# It is an interop property of OpenOCD's SMP/hwthread view, NOT a chip defect,
# and it is not something a .cfg option can switch off.
# =============================================================================

# MEASURED: the underscore spellings (gdb_report_data_abort) are DEPRECATED in
# 0.12.0-7 and warn.  These are the current spellings.
gdb report_data_abort enable
gdb report_register_access_error enable

# ---------------------------------------------------------------------------
# TIMEOUTS ARE MANDATORY HERE, AND THIS IS ONLY HALF OF THE REQUIREMENT.
#
# The transport is a simulator: ~127 us of wall clock per TCK on this design.
# MEASURED per-verb costs make the defaults untenable -- a gdb `g` packet (all
# 33 registers) is ~12,100 TCK ~ 1.7 s, and a 256-BYTE MEMORY READ THROUGH THE
# PROGRAM BUFFER IS ~26,900 TCK ~ 3.8 s, which EXCEEDS the 2 s default on
# every architecture measured.
#
# THE OTHER HALF LIVES IN THE TARGET .py: `timeout_sec = 120`.
# targets.Target.timeout_sec DEFAULTS TO 2 and is what the harness passes as
# gdb's remotetimeout, so setting only this line leaves the gdb side at 2 s and
# the first big memory read still fails.  Both halves or neither.
# Interactive gdb users want `set remotetimeout 120` for the same reason.
# ---------------------------------------------------------------------------
riscv set_command_timeout_sec 120

init

# MEASURED accepted, and REQUIRED: VestaRV has NO system bus access (DD5 /
# R-DD2).  cmdtype 2 (access-memory) answers NOT_SUPPORTED (RTL,
# debug_module.vhd), and sbcs reads all-zeros meaning "no system bus", so
# every memory access must go through the program buffer -- progbufsize = 2
# with impebreak = 1 gives the three words OpenOCD's lw/sw idiom needs.
foreach t [target names] {
    targets $t
    riscv set_mem_access progbuf
}
targets $_CHIPNAME.cpu0

# DELIBERATELY ABSENT: `riscv authdata_read` / `authdata_write`.
#   The vendored spike cfgs carry that handshake ONLY because their harness
#   forced spike's --dm-auth (testlib.py, since made conditional -- see
#   ../../VENDORED.md).  VestaRV implements no authdata register at all (0x30
#   is not one of its implemented DMI addresses) and drives
#   dmstatus.authenticated = 1.  SOURCE riscv-013.c:1642: an unauthenticated
#   DM logs an error and leaves the target unusable -- so the correct action
#   here is to say nothing.

# OPTIONAL, MEASURED: OpenOCD polls a halted target at ~1,025 TCK/s (~102 TCK
# per 100 ms).  Over a simulation bridge that is a permanent ~13 % background
# load.  `poll off` removes it EXACTLY (4,238 TCK at both 0 s and 10 s idle --
# an unambiguous control), but gdb then cannot learn about an ASYNCHRONOUS
# halt.  Recommended for TCK-budget measurement; NOT for an interactive
# session.
# poll off

# =============================================================================
# THINGS THIS CHIP DOES THAT WILL SURPRISE A DEBUGGER.  Read before filing a
# bug against OpenOCD.
#
# 1. `reset halt` REPORTS SUCCESS AND RESETS NOTHING.
#    VestaRV's ndmreset and hartreset are read-zero WARL (RTL), so there is no
#    DMI lever for a system reset.  SOURCE: assert_reset() writes HALTREQ then
#    NDMRESET and returns ERROR_OK UNCONDITIONALLY -- it never checks that
#    ndmreset took; deassert_reset() then waits only for !ALLUNAVAIL and sets
#    TARGET_HALTED unconditionally.  Net: the hart really will be halted (by
#    haltreq), nothing will have been reset, and OPENOCD CANNOT TELL YOU IT
#    DEGRADED.
#    THE REAL RESET IS THE PER-TILE PWRCTRL PATH -- see note 2.
#
# 2. THE RECOVERY LEVER EXISTS FOR HARTS 1..N-1 ONLY.  NOT FOR HART 0.
#    A tile is reset by power-cycling it through PWRCR at 0x4B00, bit h, with
#    a FULL-WORD store (the write is byte-lane-0 qualified), issued from a
#    SECOND halted hart's program buffer -- in gdb, plain memory writes.
#    PWRCR BIT 0 IS RO-0: hart 0 is the always-on management hart (SPI boot,
#    console, CLINT owner) and ignores writes.  So hart 0's only reset is the
#    chip `resetn` pad, WHICH ALSO RESETS THE DEBUG MODULE AND DROPS YOUR
#    SESSION.  Hart 0 is the hart a student attaches to first; there is no
#    lever for it, and no wording here pretends otherwise.
#    All tile state is lost on a power-cycle -- it is a COLD gate, no retention.
#
# 3. A HART HALTED AT RESET RELEASE CAN WEDGE ON A PENDING msip.
#    Launch protocol is "loader row first, then msip[h] = 1", and msip is a
#    LEVEL that stays asserted until software clears it.  A hart held halted at
#    reset never ran the bootrom, so IVT slot 83 was never armed; on resume it
#    takes the pending msip into an unarmed slot and sits in terminal
#    TRAP_STATE.
#    MEASURED END TO END AT D5, gdb-side, 2026-08-11 -- both halves, which is
#    why this reads as a procedure and not as a caution.  Walking in on
#    purpose (setresethaltreq, PWRCR power-cycle from a second halted hart,
#    then resume with msip still pending) put hart 1 in TRAP_STATE with its
#    liveness counter frozen across the next snapshot; applying the procedure
#    below and re-arming the power-cycle left it SLEEPING at pc 0x000002B4,
#    i.e. rescued.
#    THE PROCEDURE, before resuming such a hart:
#        (gdb) set *(unsigned*)(0x5000 + 4*h) = 0
#    CLINT MSIP is 0x5000+4h at BOTH N=4 and N=18.  MTIME and MTIMECMP MOVE
#    with NHARTS (N=4: 0x5010/0x5020; N=18: 0x5050/0x5060) -- never hard-code
#    those.
#    NOTE the write above is a MEMORY write, so under `target smp` it goes to
#    the connection's target -- but CLINT is in the SHARED window, so unlike a
#    TCM breakpoint it reaches the right place from any hart.  See the SMP
#    MEMORY ROUTING block above for which accesses that distinction bites.
#
# 4. THE FIRST HALT OF A HART DEPENDS ON THE DM HAVING PLANTED ITS ENTRY PAGE.
#    The Debug Module plants the 40-word trampoline itself, at every dmactive
#    rise and before every halt's token is consumed.  OpenOCD sets dmactive
#    before any haltreq (VERIFIED ON THE WIRE), so the ordering is correct by
#    construction -- but a dmcontrol write that set dmactive AND haltreq in the
#    SAME word would be a race against that plant, not an ordering.
#
# 5. There are NO hardware triggers on this chip yet.  `hbreak` and hardware
#    watchpoints are unavailable; gdb's `watch` silently degrades to a SOFTWARE
#    watchpoint, which single-steps the program at ~17,500 TCK per step and is
#    unusable over this transport.  Use software breakpoints (`break`).
#
# 6. WHILE A HART IS HALTED, dscratch0/dscratch1 IS THE SINGLE HOME OF THE
#    INTERRUPTED PROGRAM'S s0 AND s1 (R-DD9, measured end to end).  A debugger
#    that reads s0 gets dscratch0's value; a write lands there; a program-buffer
#    change to s0/s1 survives to the next abstract read; and a plain halt+resume
#    with no register writes leaves the program's pair exactly as it found it.
#    The two shared-memory words at 0x106F0/0x106F4 are the entry stub's own
#    repair copies -- they are NOT where a debugger reads those registers from,
#    and nothing else should read them at all.
#
# 7. TWO SESSION-TOOLING TRAPS, both measured, both of which read exactly like
#    a chip fault.  (a) A hardcoded gdb port that no longer matches the
#    runner's --gdb-port attaches to the WRONG TARGET: OpenOCD examines
#    perfectly and every chip-side observable stays green while every gdb-side
#    check fails.  The one tell is gdb's own log line naming the port.  (b) gdb
#    invents convenience variables: `set $mscratch = ...` and `p/x $anything`
#    SUCCEED WITH NO TARGET ATTACHED AT ALL, so a gdb transcript is not by
#    itself proof of a session.  `info registers <name>` has no such fallback
#    and fails loudly ("The program has no registers now") -- prefer it.
#
# 8. A hartsel WRITTEN BY A RAW `monitor riscv dmi_write 0x10 ...` DOES NOT
#    SURVIVE to the next monitor command: OpenOCD's background polling owns
#    dmcontrol and walks every hart between two commands (measured at both N --
#    the readback is N-1, the last hart polled).  Anything that needs hartsel
#    stable across commands must `poll off` first (and `poll on` after), or do
#    the write and the dependent read inside one command.  And after raw
#    hartsel manipulation OpenOCD's own CACHED notion of the selected hart is
#    stale: a following memory access can fail (cmderr=4, "Cannot access
#    memory") until the target is re-selected -- reselect with `targets <t>`
#    or write hartsel back before continuing (measured, D5 validation).
# =============================================================================
