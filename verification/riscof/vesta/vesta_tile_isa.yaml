# Castalia tile hart (harts 1-4), derived.hartClasses "Tile": rv32iac, M-mode only,
# trap CSRs. Zicsr and Zifencei are stated here because the generator's ISA string
# omits them while the core implements them.
hart_ids: [0]
hart0:
  ISA: RV32IACZicsr_Zifencei
  physical_addr_sz: 32
  User_Spec_Version: '2.3'
  Privilege_Spec_Version: '1.11'
  hw_data_misaligned_support: false
  supported_xlen: [32]
  misa:
    reset-val: 0x40000105
    rv32:
      accessible: true
      mxl:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - mxl[1:0] in [0x1]
            wr_illegal:
              - Unchanged
      extensions:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - extensions[25:0] bitmask [0x0000105, 0x0000000]
            wr_illegal:
              - Unchanged
