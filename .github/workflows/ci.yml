name: CI

# Tier 1: fast, license-free checks from a bare checkout.
#   generator-gates  `make generate` (header + configurator sync), MCU.vhd and
#                    MemoryMap.vhd identity, register-browser provenance
#   docs-gates       relative links, generator py_compile, hosted-runner policy
#   software-build   MP bootrom + the N=4 MP ISA image set
#   bazel-gates      `bazel test //...` minus the GHDL trees (sim.yml owns those)
#   repo-hygiene     the tools/ci/ guards
#
# The make/gcc jobs and bazel-gates prove the same generator and firmware two
# ways on purpose; a disagreement between them is itself the finding.
# Job names are the merge-queue required checks (.github/MERGE_QUEUE.md).

on:
  push:
    branches: [main]
  pull_request:
  # Required checks must report on the queue's gh-readonly-queue/ candidate,
  # or the queue stalls until it times out.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Supersede superseded PR runs only; every other event gets its own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Reproduces software/bootrom_mp/bin/rom.rcf byte-identically; matches the
  # bench machine. Bump both together.
  XPACK_GCC_VERSION: 13.2.0-2

jobs:
  generator-gates:
    name: Chip generator gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install SystemRDL toolchain
        run: python3 -m pip install --require-hashes -r tools/rdl/requirements_lock.txt

      - name: Set up RISC-V GCC
        uses: ./.github/actions/setup-riscv-gcc
        with:
          version: ${{ env.XPACK_GCC_VERSION }}

      # Runs check_memorymap_h.py and check_configurator_sync.py --strict;
      # web-copy stages out/web/MemoryMap.json for the register-browser gate.
      - name: Generate chip artifacts
        run: make -C platform/common generate web-copy

      # hdl/common/MCU.vhd is the generator product; a hand-edit cannot merge.
      - name: MCU.vhd identity gate (STRICT)
        working-directory: platform/common
        run: python3 python/check_mcu_vhd.py

      # Paths are explicit: the script's default resolves to the bench checkout.
      - name: MemoryMap.vhd drop-in gate
        working-directory: platform/common
        run: python3 python/check_memorymap_vhd.py ../../hdl/common/MemoryMap.vhd out/hdl/MemoryMap.vhd

      - name: Register browser provenance gate
        run: python3 tools/python/check_register_browser.py

  docs-gates:
    name: Docs link + generator syntax gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check documentation links
        run: python3 tools/python/check_doc_links.py

      - name: Byte-compile the chip generator
        run: python3 -m py_compile platform/common/python/*.py

      # Owner policy (2026-08-21): GitHub-hosted runners only. Reviving a
      # self-hosted tier deletes this gate in the same commit.
      - name: GitHub-hosted-runners-only gate
        # The [-] class keeps the pattern from matching this line.
        run: |
          if grep -nE "runs-on:.*self[-]hosted" .github/workflows/*.yml; then
            echo "::error::A workflow targets a self-hosted runner; this repo's CI is GitHub-hosted only (owner policy 2026-08-21)."
            exit 1
          fi
          echo "OK: every runs-on in .github/workflows/ is GitHub-hosted"

  software-build:
    name: Bootrom + ISA image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up RISC-V GCC
        uses: ./.github/actions/setup-riscv-gcc
        with:
          version: ${{ env.XPACK_GCC_VERSION }}

      # obj/ and bin/ are gitignored and not created by the makefile.
      - name: Build MP bootrom
        run: |
          mkdir -p software/bootrom_mp/obj software/bootrom_mp/bin
          make -C software/bootrom_mp

      # Every behavioral_mp test (rv32ui/ua/um/uc/uzb*) still assembles and links.
      - name: Build N=4 MP ISA image set
        working-directory: verification/isa
        run: |
          ./build_mp_images.sh 4 rcf_ci
          test "$(cat rcf_ci/.nharts)" = "4"
          echo "built $(find rcf_ci -maxdepth 1 -name '*.rcf' | wc -l) rcf images"

  # Bazel provisions python, the pinned xPack GCC and a C/C++ toolchain itself.
  # The GHDL trees are excluded so this job never builds GHDL from source;
  # sim.yml runs them. Negative patterns must follow `--`.
  bazel-gates:
    name: Bazel hermetic gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Bazel binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazelisk
          key: bazelisk-${{ hashFiles('.bazelversion') }}

      - name: Fetch bazelisk
        run: ./tools/get_bazel.sh

      # Own key so this job and sim.yml do not fight over one entry.
      - name: Cache Bazel disk + repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repo-cache
          key: bazel-ci-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: bazel-ci-

      # A MODULE.bazel edit that was never locked fails instead of re-resolving.
      - name: MODULE.bazel.lock freshness
        run: |
          tools/bin/bazel mod deps \
            --lockfile_mode=error \
            --repository_cache=~/.cache/bazel-repo-cache > /dev/null

      # Analysis covers the whole non-GHDL graph, including the GHDL-running
      # packages excluded from the test step, so a broken BUILD file fails here.
      - name: Analyze the build graph
        run: |
          tools/bin/bazel build --nobuild \
            --repository_cache=~/.cache/bazel-repo-cache \
            -- //... -//opensource_sim/... -//hdl/common/tb/... -//toolchains/...

      # synth, cpi and fpga/bringup run GHDL; they are tested in sim.yml.
      # -known_red: see README.md "Known red" (no target carries the tag today).
      - name: Run the hermetic gate set
        run: |
          set -o pipefail
          tools/bin/bazel test \
            --repository_cache=~/.cache/bazel-repo-cache \
            --build_tests_only \
            --test_tag_filters=-known_red \
            --test_output=errors \
            --test_summary=detailed \
            -- //... -//opensource_sim/... -//hdl/common/tb/... -//toolchains/... \
               -//hdl/common/synth/... -//verification/cpi/... \
               -//implementations/fpga/bringup/... \
            2>&1 | tee bazel_ci.log

      # README.md's claim that build/test never write the source tree, as a
      # gate. The convenience symlinks are named after the checkout directory
      # (not the gitignored bazel-vestarv), so they are filtered here.
      - name: Prove the build did not write into the source tree
        run: |
          dirty="$(git status --porcelain | grep -vE '^\?\? bazel-' || true)"
          if [ -n "$dirty" ]; then
            echo "::error::a bazel build/test action wrote into the source tree"
            echo "$dirty"
            git diff
            exit 1
          fi
          echo "OK: source tree unchanged by the build"

      - name: Surface failure diagnostics as annotations
        if: failure()
        uses: ./.github/actions/annotate-bazel-failures

  repo-hygiene:
    name: Repo hygiene gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history: --base needs the merge base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Line-ending guard (CRLF manifest)
        run: python3 tools/ci/check_line_endings.py

      - name: VHDL style gate (ASCII only)
        run: python3 tools/ci/check_vhdl_style.py

      - name: .bazelignore guard
        run: python3 tools/ci/check_bazelignore.py

      # Diff-scoped on pull requests, whole-tree otherwise.
      - name: Repo hygiene gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 tools/ci/check_repo_hygiene.py --base "origin/${BASE_REF}"
          else
            python3 tools/ci/check_repo_hygiene.py
          fi
