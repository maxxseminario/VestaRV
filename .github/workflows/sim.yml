name: Simulation (open source)

# Tier 2: the GHDL regression as bazel tests. Everything is hermetic: images
# come from //verification/isa (hermetic xPack GCC), @ghdl is built from source
# and the runner needs only bazelisk.
#
# A cold cache builds GHDL from source (~15-30 min); warm runs are the sims.
# The cocotb smoke test is physical.yml's sim-smoke, not here.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  merge_group:
  schedule:
    - cron: "30 8 * * *" # nightly, 08:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  isa-regression:
    name: GHDL ISA regression (bazel)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Bazel binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazelisk
          key: bazelisk-${{ hashFiles('.bazelversion') }}

      - name: Fetch bazelisk
        run: ./tools/get_bazel.sh

      # Disk cache carries the from-source GHDL build; the restore-key keeps a
      # stale-but-warm cache useful after a dependency bump.
      - name: Cache Bazel disk + repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repo-cache
          key: bazel-sim-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: bazel-sim-

      # Targets are named, never //opensource_sim/... by wildcard: a new GHDL
      # target joins this gate only by being listed here.
      #   isa_regression          9 ISA suites, bare core, M and B on
      #   hdl/common/tb:all       standalone unit benches
      #   synth, synth_coverage   `ghdl --synth` on every block; every entity covered
      #   cpi_default             CPI micro-kernels + short benchmarks (TRM Section 12)
      #   pmp                     rv32ua PMP images, both ENABLE_IF_AHEAD polarities
      #   *_elaborate             the generated MCU.vhd for castalia, castalia_b
      #                           (every isa.* knob on) and fpga_default (hdl/fpga cells)
      #   fpga/bringup:all        SPI-flash boot of fpga_default through the real ROM
      #   tile_rv32ui             rv32ui with M and B off (the corner-tile ISA)
      #   rv4th_forth             real boot ROM + Forth monitor over UART0 (~4 min)
      - name: Run ISA regression + GHDL unit benches
        run: |
          set -o pipefail
          tools/bin/bazel test \
            --repository_cache=~/.cache/bazel-repo-cache \
            --test_tag_filters=-known_red \
            --test_output=errors \
            --test_summary=detailed \
            -- \
            //opensource_sim:isa_regression \
            //hdl/common/tb:all \
            //hdl/common/synth:synth \
            //toolchains/ghdl:synth_coverage_test \
            //verification/cpi:cpi_default \
            //opensource_sim/pmp:pmp \
            //opensource_sim/mcu:mcu_elaborate \
            //opensource_sim/castalia_b:castalia_b_elaborate \
            //opensource_sim/fpga_default:fpga_default_elaborate \
            //implementations/fpga/bringup:all \
            //opensource_sim/tile_isa:tile_rv32ui \
            //opensource_sim/rv4th:rv4th_forth \
            2>&1 | tee bazel_ci.log

      - name: Surface failure diagnostics as annotations
        if: failure()
        uses: ./.github/actions/annotate-bazel-failures
