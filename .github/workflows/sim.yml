name: Simulation (open source)

# Tier 2 — the GHDL ISA regression as bazel tests on GitHub-hosted runners.
#
# This REPLACES the self-hosted Cadence/Xcelium tier (2026-08-21): that
# runner never executed a job (the `cadence` label was never applied — see
# .github/RUNNER_SETUP.md for the post-mortem and how to bring it back), and
# every push left a yellow queued run behind it. The full Cadence workflow is
# preserved in this file's git history for when the bench runner returns;
# nothing here forecloses that.
#
# What runs: `bazel test //opensource_sim:isa_regression` — one sh_test per
# ISA suite (9 suites), driving opensource_sim/isa/run_isa.sh in
# prebuilt-image mode. The explicit suite target, NOT //opensource_sim/...:
# the per-test ghdl_test port growing in //opensource_sim/isa joins this
# gate deliberately (see the note in opensource_sim/BUILD.bazel), never by
# wildcard while it is mid-port. EVERYTHING is hermetic inside bazel: the RISC-V images
# come from //verification/isa's os_* targets (hermetic xPack GCC), the
# simulator is @ghdl built from source (mcode), and its VHDL-2008 std/ieee
# libraries are bazel outputs. The runner needs NO EDA installs — only
# bazelisk, which tools/get_bazel.sh fetches.
#
# The cocotb smoke test is deliberately NOT here: physical.yml's sim-smoke
# job runs it on every PR/push already.
#
# Cost note: the first run on a cold cache builds GHDL from source (GNAT
# bootstrap + Ada compile, ~15-30 min). The bazel disk cache below carries
# the toolchain across runs, so warm runs are dominated by the ~139 GHDL
# sims (~5-10 min at 4 local test jobs).

on:
  push:
    branches: [main, multicore-mp]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 8 * * *"   # nightly (UTC), same slot the Cadence tier held
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isa-regression:
    name: GHDL ISA regression (bazel)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch bazelisk
        run: ./tools/get_bazel.sh

      # One cache, two payloads: the disk cache (action outputs — including
      # the from-source GHDL build) and the repository cache (downloaded
      # externals: GNAT, xPack GCC, zig). Keyed on the module lockfile; the
      # restore-key keeps a stale-but-warm cache useful after a dep bump.
      - name: Cache bazel disk + repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repo-cache
          key: bazel-sim-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: bazel-sim-

      - name: Run ISA regression
        run: |
          tools/bin/bazel test //opensource_sim:isa_regression \
            --repository_cache=~/.cache/bazel-repo-cache \
            --test_output=errors \
            --test_summary=detailed

      # Raw job logs are auth-only; annotations are anonymously readable via
      # the check-runs API — the diagnostic channel a credential-less bench
      # session can see (same pattern as physical.yml).
      - name: Surface failing test logs as annotations
        if: failure()
        run: |
          find bazel-testlogs -name test.log | while read -r f; do
            if grep -qE "^FAIL|TIMEOUT|ERROR" "$f"; then
              echo "== $f"
              tail -20 "$f"
              grep -E "^(FAIL|TIMEOUT)" "$f" | head -3 | while IFS= read -r line; do
                echo "::error::${f#bazel-testlogs/}: ${line}"
              done
            fi
          done
