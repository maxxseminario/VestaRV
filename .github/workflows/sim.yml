name: Simulation (open source)

# Tier 2 — the GHDL ISA regression as bazel tests on GitHub-hosted runners.
#
# This REPLACES the self-hosted Cadence/Xcelium tier (2026-08-21): that
# runner never executed a job (the `cadence` label was never applied — see
# .github/RUNNER_SETUP.md for the post-mortem and how to bring it back), and
# every push left a yellow queued run behind it. The full Cadence workflow is
# preserved in this file's git history for when the bench runner returns;
# nothing here forecloses that.
#
# What runs: `bazel test //opensource_sim:isa_regression` — one sh_test per
# ISA suite (9 suites), driving opensource_sim/isa/run_isa.sh in
# prebuilt-image mode. The explicit suite target, NOT //opensource_sim/...:
# the per-test ghdl_test port growing in //opensource_sim/isa joins this
# gate deliberately (see the note in opensource_sim/BUILD.bazel), never by
# wildcard while it is mid-port. EVERYTHING is hermetic inside bazel: the RISC-V images
# come from //verification/isa's os_* targets (hermetic xPack GCC), the
# simulator is @ghdl built from source (mcode), and its VHDL-2008 std/ieee
# libraries are bazel outputs. The runner needs NO EDA installs — only
# bazelisk, which tools/get_bazel.sh fetches.
#
# The cocotb smoke test is deliberately NOT here: physical.yml's sim-smoke
# job runs it on every PR/push already.
#
# Cost note: the first run on a cold cache builds GHDL from source (GNAT
# bootstrap + Ada compile, ~15-30 min). The bazel disk cache below carries
# the toolchain across runs, so warm runs are dominated by the ~139 GHDL
# sims (~5-10 min at 4 local test jobs).

on:
  push:
    branches: [main, multicore-mp]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 8 * * *"   # nightly (UTC), same slot the Cadence tier held
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isa-regression:
    name: GHDL ISA regression (bazel)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch bazelisk
        run: ./tools/get_bazel.sh

      # One cache, two payloads: the disk cache (action outputs — including
      # the from-source GHDL build) and the repository cache (downloaded
      # externals: GNAT, xPack GCC, zig). Keyed on the module lockfile; the
      # restore-key keeps a stale-but-warm cache useful after a dep bump.
      - name: Cache bazel disk + repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repo-cache
          key: bazel-sim-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: bazel-sim-

      # //hdl/common/tb carries the standalone unit benches (mp_arbiter,
      # pmp_unit, the FPU vector format check). They are GHDL-backed, so they
      # ride with this job rather than ci.yml's bazel-gates, which deliberately
      # excludes everything that would drag in the from-source GHDL build.
      #
      # //verification/cpi:cpi_default is the CPI measurement harness's fast
      # set (all 36 micro-kernels plus the three short benchmarks in both
      # -march polarities), which gates the numbers TRM Section 12 publishes.
      # The named suite, NOT //verification/cpi/...: the long benchmarks in
      # that package are `manual` and are minutes of simulation each.
      #
      # //opensource_sim/pmp:pmp is the PMP regression's RTL half: the fifteen
      # rv32ua PMP images run against a core elaborated with TRAPCSR, U-mode
      # and PMP true, at BOTH polarities of ENABLE_IF_AHEAD. Both matter. The
      # fetch-ahead re-points the instruction-fetch check address, and a
      # mutation that restores the old one is caught ONLY by the ifahead_on
      # half, so a single-polarity gate would not see that regression at all.
      # //opensource_sim/mcu:mcu_elaborate is the only thing in the estate that
      # elaborates hdl/common/MCU.vhd. Every other GHDL target here, this
      # workflow's whole ISA regression included, instantiates the bare CORE.
      # MCU.vhd is GENERATED and moves on every knob change, and its size
      # asserts against the ROM and TCM macros execute at time zero, so the
      # target is a 1 ns run and not just an analysis. It is named explicitly
      # for the reason the header gives: this job takes targets, never
      # //opensource_sim/... by wildcard.
      #
      # //opensource_sim/rv4th:rv4th_forth boots that same MCU out of the REAL
      # boot ROM image and drives the Forth monitor over UART0 -- the only gate
      # anywhere on the interactive face of the fabricated part. It is the
      # slowest test in this job at about 4 minutes, and it is the fast half of
      # its bench: :rv4th_forth_full adds the 131 ms clock-frequency
      # measurement and is `manual`. Named explicitly, same rule as above.
      - name: Run ISA regression + GHDL unit benches
        run: |
          set -o pipefail
          tools/bin/bazel test //opensource_sim:isa_regression //hdl/common/tb:all \
            //verification/cpi:cpi_default \
            //opensource_sim/pmp:pmp \
            //opensource_sim/mcu:mcu_elaborate \
            //opensource_sim/rv4th:rv4th_forth \
            --repository_cache=~/.cache/bazel-repo-cache \
            --test_tag_filters=-known_red \
            --test_output=errors \
            --test_summary=detailed 2>&1 | tee bazel_ci.log

      # Raw job logs are auth-only; annotations are anonymously readable via
      # the check-runs API — the diagnostic channel a credential-less bench
      # session can see (same pattern as physical.yml). Two sources, because
      # they cover different failure phases: bazel's own ERROR lines catch
      # loading/analysis failures (a missing package produces NO test.log at
      # all — learned on 0c0bff1), test.log tails catch actual sim failures.
      - name: Surface failure diagnostics as annotations
        if: failure()
        run: |
          grep -E "^ERROR:" bazel_ci.log | head -5 | while IFS= read -r line; do
            echo "::error::bazel: ${line}"
          done
          find bazel-testlogs -name test.log 2>/dev/null | while read -r f; do
            if grep -qE "^FAIL|TIMEOUT|ERROR" "$f"; then
              echo "== $f"
              tail -20 "$f"
              grep -E "^(FAIL|TIMEOUT)" "$f" | head -3 | while IFS= read -r line; do
                echo "::error::${f#bazel-testlogs/}: ${line}"
              done
            fi
          done
