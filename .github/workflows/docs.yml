name: Docs CI

# Lightweight documentation checks. No Cadence tools, no LaTeX, and no `make chip`
# (those toolchains are not available in CI) — this only validates documentation links
# and byte-compiles the pure-Python generator so syntax errors are caught early.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check documentation links
        run: python tools/python/check_doc_links.py

      - name: Byte-compile the chip generator (py_compile)
        run: python -m py_compile platform/common/python/*.py
