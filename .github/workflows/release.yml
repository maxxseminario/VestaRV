name: Release (tagged version)

# Pushing tag vX.Y.Z publishes a GitHub Release whose notes are CHANGELOG.md's
# "## [X.Y.Z]" section and whose assets are re-proven at that tag: the GHDL
# bridge netlist, the LibreLane signoff bundle and the published TRM.
# physical.yml is called, not duplicated, so check_metrics.py must pass before
# anything is published. Move the Unreleased notes into a real section before
# tagging, or the release stops at the changelog gate.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog release-notes gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract this version's section from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") { hit = 1 }
            hit && seen && /^## \[/ { exit }
            hit { seen = 1; print }
          ' CHANGELOG.md > release_notes.md
          if ! [ -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$VER]\" section; write the changelog entry, commit it, then re-tag."
            exit 1
          fi
          echo "release notes ($(wc -l < release_notes.md) lines):"
          cat release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  # The called workflow's uploads land in this run, where publish reads them.
  physical:
    name: Physical flow
    uses: ./.github/workflows/physical.yml
    with:
      harden: true

  publish:
    name: Publish GitHub release
    needs: [changelog, physical]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download run artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # Layout: artifacts/vesta-sky130-signoff/<runtag>/final/...
      - name: Assemble release assets
        run: |
          set -eu
          mkdir -p assets
          metrics="$(find artifacts/vesta-sky130-signoff -name metrics.json -path '*/final/*' | head -1)"
          test -n "$metrics" || { echo "::error::signoff artifact has no final/metrics.json"; exit 1; }
          signoff_dir="$(dirname "$metrics")"
          cp "$metrics" "assets/vesta-sky130-metrics-${GITHUB_REF_NAME}.json"
          tar -czf "assets/vesta-sky130-signoff-${GITHUB_REF_NAME}.tar.gz" \
              -C "$(dirname "$signoff_dir")" final
          cp artifacts/vesta-verilog/vesta.v "assets/vesta-${GITHUB_REF_NAME}.v"
          cp implementations/asic/castalia/docs/TRM.pdf "assets/VestaRV-TRM-${GITHUB_REF_NAME}.pdf"
          ls -l assets/

      # Idempotent: a re-run refreshes the assets of an existing release.
      - name: Create or update the release
        run: |
          set -eu
          title="VestaRV ${GITHUB_REF_NAME}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --verify-tag \
              --title "$title" \
              --notes-file artifacts/release-notes/release_notes.md
          fi
