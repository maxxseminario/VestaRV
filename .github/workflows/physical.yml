name: Physical (sky130 RTL-to-GDSII)

# Tier 3: the FOSS sky130 flow (GHDL bridge, LibreLane, magic/KLayout DRC,
# netgen LVS, 9-corner STA; see sky130/README.md).
#   verilog-bridge, sim-smoke  minutes; on pushes/PRs that touch the core RTL
#                              or sky130/, and on every merge-group candidate
#   harden                     the full RTL-to-GDSII run, ~4-5 h; weekly, manual,
#                              per release (workflow_call from release.yml), the
#                              `run-physical` PR label, or "[run-physical]" in a
#                              pushed head commit message (the credential-less
#                              escape hatch). Signoff is judged from
#                              final/metrics.json by sky130/check_metrics.py.
#
# The path filters also gate the label and commit-message routes; to harden a
# change outside them, dispatch this workflow on its branch.
#
# ubuntu-24.04 is pinned because the GHDL tarball is built per OS. Bump
# GHDL_VERSION and the runner image together.

on:
  push:
    branches: [main]
    paths:
      - "hdl/**"
      - "sky130/**"
      - ".github/workflows/physical.yml"
      - ".github/actions/setup-ghdl/**"
  pull_request:
    # `labeled` so attaching `run-physical` starts harden immediately.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "hdl/**"
      - "sky130/**"
      - ".github/workflows/physical.yml"
      - ".github/actions/setup-ghdl/**"
  merge_group:
  schedule:
    - cron: "30 2 * * 6" # weekly full hardening, Saturday 02:30 UTC
  workflow_dispatch:
  # release.yml re-proves the flow at the tag; uploads land in the caller's run.
  workflow_call:
    inputs:
      harden:
        description: Run the full GDSII hardening job.
        type: boolean
        default: true

permissions:
  contents: read

# PR runs supersede each other; a labeled event gets its own group so adding an
# unrelated label never cancels an in-flight run. Every other event is unique.
concurrency:
  group: physical-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.ref, github.event.label.name) || github.run_id }}
  cancel-in-progress: true

env:
  # Satisfies the flow's GHDL >= 5.x floor.
  GHDL_VERSION: 6.0.0
  # The LibreLane version the config was verified against; it pins open_pdks.
  LIBRELANE_VERSION: 3.0.5

jobs:
  verilog-bridge:
    name: Verilog bridge (GHDL synth)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHDL
        uses: ./.github/actions/setup-ghdl
        with:
          version: ${{ env.GHDL_VERSION }}

      # synth.sh owns the analysis order and self-checks its output. On
      # failure the log tail is re-emitted as annotations: they are readable
      # anonymously through the check-runs API, raw job logs are not.
      - name: VHDL -> Verilog (synth.sh)
        working-directory: sky130
        run: |
          ghdl --version
          if ! ./synth.sh > synth_ci.log 2>&1; then
            echo "synth.sh FAILED, full log:"
            cat synth_ci.log
            tail -8 synth_ci.log | while IFS= read -r line; do
              echo "::error::synth.sh: ${line}"
            done
            exit 1
          fi
          tail -3 synth_ci.log

      # Consumed by harden; also the netlist a release ships.
      - name: Upload bridge netlist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vesta-verilog
          path: sky130/src/vesta.v
          if-no-files-found: error

  sim-smoke:
    name: Core smoke sim (cocotb on GHDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHDL
        uses: ./.github/actions/setup-ghdl
        with:
          version: ${{ env.GHDL_VERSION }}

      - name: Install cocotb 2.x
        run: python3 -m pip install "cocotb~=2.0"

      - name: Run smoke test
        working-directory: sky130/sim
        run: make

      # cocotb makefiles have returned 0 with failures in results.xml; fail on
      # any recorded failure or an empty run.
      - name: Verify results.xml
        working-directory: sky130/sim
        run: |
          python3 - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("results.xml").getroot()
          n, bad = 0, 0
          for c in root.iter("testcase"):
              n += 1
              if c.find("failure") is not None or c.find("error") is not None:
                  bad += 1
                  print("FAILED:", c.get("classname"), c.get("name"))
          print("%d test(s), %d failure(s)" % (n, bad))
          sys.exit(1 if (bad or n == 0) else 0)
          EOF

  harden:
    name: Full GDSII hardening + signoff gate (LibreLane)
    # Never on plain pushes or merge groups: a 4-5 h job stays out of every
    # merge path. A labeled event hardens only when the new label is
    # run-physical, so unrelated labels do not restart it.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      inputs.harden == true ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-physical') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-physical')) ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[run-physical]'))
    needs: verilog-bridge
    runs-on: ubuntu-24.04
    # Inside the 6 h hosted ceiling. If it ever times out, the fix is a bigger
    # runner, not fewer signoff corners.
    timeout-minutes: 350
    concurrency:
      group: physical-harden-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch bridge netlist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vesta-verilog
          path: sky130/src

      # LibreLane fetches the ~2 GB sky130A PDK via ciel, pinned by its version.
      - name: Cache sky130 PDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ciel
          key: ciel-sky130-librelane-${{ env.LIBRELANE_VERSION }}

      # --dockerized runs the tools in LibreLane's own pinned image, so tool
      # versions move in lockstep with LIBRELANE_VERSION.
      - name: Install LibreLane
        run: python3 -m pip install "librelane==${LIBRELANE_VERSION}"

      - name: Harden vesta (RTL -> GDSII, DRC, LVS, 9-corner STA)
        run: |
          python3 -m librelane --dockerized --pdk-root "$HOME/.ciel" \
            sky130/config.yaml

      # Signoff is judged from final/metrics.json, never from logs.
      - name: Signoff gate (check_metrics.py)
        run: |
          metrics="$(find sky130/runs -path '*/final/metrics.json' 2>/dev/null | sort | tail -1)"
          test -n "$metrics" || { echo "::error::no final/metrics.json produced"; exit 1; }
          python3 sky130/check_metrics.py "$metrics"

      - name: Upload signoff results (GDS, netlists, metrics, reports)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vesta-sky130-signoff
          path: |
            sky130/runs/*/final
            sky130/runs/*/resolved.json
          if-no-files-found: error
